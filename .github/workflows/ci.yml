# CI — ce qui doit être vrai à chaque poussée.
#
# Quatre jobs, et ils ne se remplacent pas :
#   · `qualité`   compile, construit, et fait tourner LES TREIZE GARDES du dépôt — c'est
#                 `npm run lint` qui les enchaîne, et c'est la seule chose à lire pour
#                 savoir ce qui tourne. ⚠️ La réciproque est fausse : un garde peut vivre
#                 ailleurs que dans `lint` (dans `build`, par exemple) — ne conclus jamais
#                 de la lecture du seul script `lint` qu'un garde ne tourne pas ;
#   · `version`   et `contrat` : deux vérifications de LIVRAISON, bloquantes, qui existent
#                 parce qu'une procédure écrite a échoué. Elles sont dans deux jobs séparés
#                 pour qu'un échec de l'une n'empêche pas l'autre de s'exprimer ;
#   · `hygiène`   non bloquant : il signale, il n'arrête pas.
#
# Node est ÉPINGLÉ. `engines` dit >=18, mais un test de contraste qui dépend d'une version
# de moteur serait un test qu'on ne peut pas rejouer.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '22.11.0'

jobs:
  qualite:
    name: Qualité — types, gardes, build, vitrine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix demo

      # `lint` enchaîne le typecheck et LES TREIZE GARDES : références de jetons, version,
      # contrat de marque, collision d'utilitaires, classes mortes, tailles en px, classes
      # fragiles, substitution figée, contraste, échelle des surfaces, catalogue, dérive du
      # preflight, littéraux.
      # Les trois derniers arrivés lisent le CODE, pas le CSS — ils sont nés dans une app
      # et versés au socle en v0.20.0 : `check-dead-utilities`, `check-font-px`,
      # `check-fragile-classes`. Chacun porte son jumeau de falsification et le rejoue à
      # chaque appel : un garde qu'on n'a jamais vu échouer ne garde rien.
      - name: lint (typecheck · les treize gardes)
        run: npm run lint

      # Le garde qui lit les COMPOSANTS et la DOC (les autres lisent le CSS) : sections du
      # catalogue ↔ exports réels, icônes citées ↔ IconName, compte annoncé ↔ décompte réel.
      # Déjà couvert par `lint`, mais nommé ici pour que son échec se lise d'un coup d'œil.
      - name: catalogue ↔ code
        run: node check-catalogue.mjs

      - name: build du paquet
        run: npm run build

      # Le montage de la vitrine sur la marque livrée, `brand-julien-fernandes.css` : le
      # dispositif qui prouve que les deux couches se montent et rendent ensemble. La preuve
      # de NEUTRALITÉ du socle, elle, se fait dans le gabarit — c'est sa marque d'exemple qui
      # est froide, serif et sans un orange.
      - name: vitrine — marque par défaut
        run: npm run demo:build

  version:
    name: Version — cohérence package · README · tag, BLOQUANT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Les tags sont nécessaires à ce job : sans eux, `git tag --list` est vide
          # et le contrôle de version ne peut pas voir si le tag existe.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Il n'y a pas de registre : chaque app épingle une version par un tag. Les trois
      # endroits qui portent le numéro doivent concorder. La procédure écrite a échoué
      # trois fois de suite — 0.3.0, 0.4.0, 0.4.1. Ce job existe pour ça.
      - name: version ≡ README ≡ tag
        run: node check-version.mjs

  contrat:
    name: Contrat — complétude de la marque, BLOQUANT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Le gabarit est la liste de ce qu'un fichier de marque DOIT fournir. S'il diverge de
      # la marque par défaut, un client remplit consciencieusement un contrat incomplet et
      # livre un système où une variable n'existe pas.
      - name: contrat de marque complet
        run: node check-contract.mjs

  hygiene:
    name: Hygiène — littéraux (non bloquant)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: aucun littéral hors des fichiers de marque et de jetons
        run: ./check-literals.sh
